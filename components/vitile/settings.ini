# Настройки vitile. После правки выполни: python3 ~/programming/linux/kde_zephyr/components/vitile/vitile.py apply

[layout]
# Отступ от краёв экрана (и от панели), в пикселях
outer_gap = 10
# Расстояние между окнами, в пикселях
inner_gap = 10
# Зазор от плавающей панели сверху или сбоку, в пикселях. Plasma прилепляет панель к краю экрана,
# как только окно касается её области, поэтому 1 — самое близкое, при котором она плавает.
# Рамка окна рисуется снаружи и съедает часть зазора: 3 при рамке 3 и масштабе 1.3 — воздух от окна до панели такой же, как от панели до края экрана.
# С той стороны, где нет плавающей панели, работает outer_gap
top_gap = 3
# Программы, которые не трогаем (класс окна через запятую).
# Класс окна можно узнать: Alt+F3 → Дополнительно → Особые параметры окна
exclude = org.kde.kcalc, org.kde.spectacle, org.kde.polkit-kde-authentication-agent-1, krunner, yakuake

[border]
# Толщина рамки, в пикселях
width = 2
# Радиус скругления углов, пиксели. Своя рамка vitile скругляет само окно —
# можно сколько угодно (с запасной темой Aurorae — не больше ~3 × толщина)
radius = 8
# Высота заголовка у окон вне плитки, пиксели
title_height = 30
# Цвет рамки у активного окна и у остальных (#RRGGBB или #RRGGBBAA)
active_color = #7aa2f7
inactive_color = #3b4261

[animation]
# Анимации в духе Hyprland: yes или no
enabled = yes
# Длительность, миллисекунды (меньше — быстрее)
duration = 220
# С какого размера «выпрыгивает» новое окно (0.85 = 85%)
popin_scale = 0.85
# Плавно двигать окна, когда плитка перестраивается: yes или no
move = yes

[keys]
# Горячие клавиши vitile. Пиши как в KDE: Meta, Shift, Ctrl, Alt через «+» и клавиша:
# буква/цифра, Left Right Up Down, Space, Return, Tab, Esc, F1…F12, PgUp, PgDown, Home, End…
# none — убрать клавишу. Сочетания, занятые другими программами KDE, vitile не отбирает,
# а пишет при apply, кем они заняты.
focus_left = Meta+Left
focus_right = Meta+Right
focus_up = Meta+Up
focus_down = Meta+Down
move_left = Meta+Shift+Left
move_right = Meta+Shift+Right
move_up = Meta+Shift+Up
move_down = Meta+Shift+Down
wider = Meta+Alt+Right
narrower = Meta+Alt+Left
taller = Meta+Alt+Up
shorter = Meta+Alt+Down
fullscreen = Meta+F
float = Meta+Space
minimize = Meta+Q
restore = Meta+Shift+Q
close = Meta+M
toggle = Meta+Shift+T
help = Meta+Shift+F1
